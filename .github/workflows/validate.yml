name: Validate plugin submissions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'registry/plugins/**'
      - 'dist/**'
      - 'schema/**'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the base branch tip
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base FETCH_HEAD HEAD)"
          if [ -z "$base" ]; then
            echo "::error::could not resolve the tip of the base branch ($BASE_REF)"
            exit 1
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - name: Reject changes to dist/ (generated)
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -q '^dist/'; then
            echo "::error::Do not edit dist/ — it is generated on merge by publish.yml."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate changed entries
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'registry/plugins/*.json' || true)"
          if [ -z "$files" ]; then
            echo "No registry entries changed; validating all entries."
            npm run validate
            exit 0
          fi
          echo "$files" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            node scripts/validate-entry.mjs "$f"
          done
