name: Publish registry

on:
  push:
    branches: [main]
    paths:
      - 'registry/plugins/**'
      - 'build/**'
      - 'schema/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run aggregate

      - name: Commit dist/
        run: |
          if git diff --quiet dist/; then
            echo "dist/ already up to date"
            exit 0
          fi
          git config user.name "rolodex-plugins-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore(registry): publish dist/index.json"
          git push

  pages:
    needs: publish
    runs-on: ubuntu-latest
    # Enable GitHub Pages (Settings → Pages → GitHub Actions) before this job can succeed.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
