name: Publish registry

on:
  push:
    branches: [main]
    paths:
      - 'registry/plugins/**'
      - 'build/**'
      - 'schema/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One in-flight Pages deploy. Cancel stale runs so a re-run cannot leave
# two artifacts named "github-pages" for deploy-pages to trip over.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run aggregate
      - run: npm run pages

      - name: Commit dist/
        run: |
          if git diff --quiet dist/; then
            echo "dist/ already up to date"
            exit 0
          fi
          git config user.name "rolodex-plugins-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore(registry): publish dist/index.json"
          git push

      # Exactly one upload per workflow run (required by deploy-pages).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
